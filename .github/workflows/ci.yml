name: quality-gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run Spring Boot tests
        run: mvn -B test

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-admin/package.json
      - run: npm install
      - run: npm run build

  mobile-h5-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
      - run: npm run build:h5

  web-e2e:
    runs-on: ubuntu-latest
    needs: web-build
    defaults:
      run:
        working-directory: tests/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Start Web dev server
        working-directory: web-admin
        run: |
          npm install
          npm run dev -- --host 0.0.0.0 > /tmp/campus-food-web.log 2>&1 &
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:5173/ && break || sleep 2; done
      - name: Run Web smoke tests
        run: npm test

  api-smoke:
    runs-on: ubuntu-latest
    needs: backend-test
    defaults:
      run:
        working-directory: tests/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Start backend
        working-directory: backend
        run: |
          mvn -B spring-boot:run > /tmp/campus-food-backend.log 2>&1 &
          for i in {1..45}; do curl --fail --silent http://127.0.0.1:8080/actuator/health || curl --fail --silent http://127.0.0.1:8080/api/health && break || sleep 2; done
      - run: pip install -r requirements.txt
      - name: Run API smoke tests
        run: pytest -m smoke --base-url http://localhost:8080
